services:
  - type: web
    name: iprp-api
    runtime: node
    rootDir: backend
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    preDeployCommand: pnpm migrate
    startCommand: pnpm start
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: PUBLIC_FIRM_SIGNUP_ENABLED
        value: "false"
      - key: ORGANIZATION_INTENT_TTL_SECONDS
        value: "3600"
      - key: PUBLIC_APP_URL
        value: "https://intellectual-property-research-plat.vercel.app"
      - key: INVITATION_MAILER_PROVIDER
        value: resend
      - key: INVITATION_MAILER_API_KEY
        sync: false
      - key: INVITATION_MAILER_FROM
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: DATABASE_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "15000"
      - key: HTTP_KEEP_ALIVE_TIMEOUT_MS
        value: "5000"
      - key: HTTP_HEADERS_TIMEOUT_MS
        value: "10000"
      - key: HTTP_REQUEST_TIMEOUT_MS
        value: "30000"
      - key: HTTP_MAX_HEADERS_COUNT
        value: "100"
      - key: REDIS_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWT_VERIFICATION_MODE
        value: jwks
      - key: SUPABASE_JWT_ALGORITHMS
        value: ES256
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: AUTH_RATE_LIMIT_ENABLED
        value: "true"
      - key: AUTH_RATE_LIMIT_KEY_SECRET
        sync: false

      # Search now uses the canonical Supabase/PostgreSQL corpus directly.
      # ELASTICSEARCH_URL remains only to satisfy the legacy config validator;
      # SEARCH_BACKEND=postgres means no request is sent to it.
      - key: SEARCH_ENABLED
        value: "true"
      - key: SEARCH_BACKEND
        value: postgres
      - key: ELASTICSEARCH_URL
        value: "https://iprp-api.onrender.com"
      - key: ELASTICSEARCH_INDEX
        value: trademarks_composite
      - key: SEARCH_SOURCE_REGISTRIES
        value: USPTO
      - key: SEARCH_SOURCE_TIMEOUT_MS
        value: "30000"
      - key: SEARCH_MAX_RESULTS
        value: "50"
      - key: SEARCH_REFRESH_EXPECTED_INTERVAL_HOURS
        value: "24"
      - key: SEARCH_MAX_MISSED_REFRESH_RUNS
        value: "2"

      # Keyless USPTO Trademark Daily XML ingestion. The first run creates a
      # bounded rolling baseline; later runs overlap recent days idempotently.
      - key: USPTO_BULK_SOURCE
        value: listing
      - key: USPTO_BULK_LISTING_URL
        value: "https://bulkdata.uspto.gov/data/trademark/daily/"
      - key: USPTO_LISTING_BASELINE_DAYS
        value: "30"
      - key: USPTO_INGESTION_OVERLAP_DAYS
        value: "3"
      - key: USPTO_REFRESH_IN_PROCESS_ENABLED
        value: "true"
      - key: USPTO_REFRESH_INTERVAL_MS
        value: "21600000"

      - key: OFFICE_ACTION_SEARCH_ENABLED
        value: "false"
      - key: OFFICE_ACTION_SOURCE_REGISTRIES
        value: USPTO
      - key: OFFICE_ACTION_SOURCE_TIMEOUT_MS
        value: "30000"
      - key: OFFICE_ACTION_SEARCH_MAX_RESULTS
        value: "50"

      - key: WATCH_ENABLED
        value: "true"
      - key: WATCH_IN_PROCESS_ENABLED
        value: "true"
      - key: WATCH_SCHEDULER_INTERVAL_MS
        value: "60000"
      - key: WATCH_SCHEDULER_BATCH_SIZE
        value: "50"
      - key: WATCH_POLL_INTERVAL_MINUTES
        value: "1440"
      - key: WORKER_HEARTBEAT_TTL_SECONDS
        value: "60"

      - key: PDF_EXPORT_ENABLED
        value: "false"
      - key: PDF_EXPORT_STORAGE_PROVIDER
        value: database
      - key: PDF_EXPORT_QUEUE_KEY
        value: queue:pdf_export

      # Billing remains intentionally unchanged for this release.
      - key: PAYSTACK_ENABLED
        value: "false"
      - key: PAYSTACK_MODE
        value: live
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_STARTER_PLAN_CODE
        sync: false
      - key: PAYSTACK_STARTER_AMOUNT_SUBUNIT
        sync: false
      - key: PAYSTACK_STARTER_CURRENCY
        value: NGN
      - key: PAYSTACK_PROFESSIONAL_PLAN_CODE
        sync: false
      - key: PAYSTACK_PROFESSIONAL_AMOUNT_SUBUNIT
        sync: false
      - key: PAYSTACK_PROFESSIONAL_CURRENCY
        value: NGN

  # Optional dedicated ingestion process. The API currently runs the same
  # advisory-lock-protected refresh in-process, so provisioning this cron later
  # is safe and does not require Elasticsearch or a USPTO API key.
  - type: cron
    name: iprp-uspto-ingestion
    runtime: node
    rootDir: backend
    schedule: "15 07 * * *"
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm refresh:uspto-search
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "3"
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "10000"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "60000"
      - key: SEARCH_BACKEND
        value: postgres
      - key: ELASTICSEARCH_URL
        value: "https://iprp-api.onrender.com"
      - key: ELASTICSEARCH_INDEX
        value: trademarks_composite
      - key: USPTO_BULK_SOURCE
        value: listing
      - key: USPTO_BULK_LISTING_URL
        value: "https://bulkdata.uspto.gov/data/trademark/daily/"
      - key: USPTO_LISTING_BASELINE_DAYS
        value: "30"
      - key: USPTO_INGESTION_OVERLAP_DAYS
        value: "3"
      - key: SEARCH_REFRESH_EXPECTED_INTERVAL_HOURS
        value: "24"
      - key: SEARCH_MAX_MISSED_REFRESH_RUNS
        value: "2"

  # Optional dedicated Watch worker. Production can use this instead of the
  # in-process worker once the service is provisioned with the same secrets.
  - type: worker
    name: iprp-watch-worker
    runtime: node
    rootDir: backend
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm watch:worker
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: DATABASE_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "15000"
      - key: REDIS_URL
        sync: false
      - key: SEARCH_ENABLED
        value: "true"
      - key: SEARCH_BACKEND
        value: postgres
      - key: ELASTICSEARCH_URL
        value: "https://iprp-api.onrender.com"
      - key: ELASTICSEARCH_INDEX
        value: trademarks_composite
      - key: SEARCH_SOURCE_REGISTRIES
        value: USPTO
      - key: SEARCH_SOURCE_TIMEOUT_MS
        value: "30000"
      - key: SEARCH_MAX_RESULTS
        value: "50"
      - key: SEARCH_REFRESH_EXPECTED_INTERVAL_HOURS
        value: "24"
      - key: SEARCH_MAX_MISSED_REFRESH_RUNS
        value: "2"
      - key: WATCH_ENABLED
        value: "true"
      - key: WATCH_SCHEDULER_INTERVAL_MS
        value: "60000"
      - key: WATCH_SCHEDULER_BATCH_SIZE
        value: "50"
      - key: WATCH_POLL_INTERVAL_MINUTES
        value: "1440"
      - key: WORKER_HEARTBEAT_TTL_SECONDS
        value: "60"
      - key: INVITATION_MAILER_PROVIDER
        value: resend
      - key: INVITATION_MAILER_API_KEY
        sync: false
      - key: INVITATION_MAILER_FROM
        sync: false
      - key: PUBLIC_APP_URL
        value: "https://intellectual-property-research-plat.vercel.app"

  - type: worker
    name: iprp-pdf-export-worker
    runtime: node
    rootDir: backend
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm pdf-export:worker
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: DATABASE_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "15000"
      - key: REDIS_URL
        sync: false
      - key: PDF_EXPORT_ENABLED
        value: "false"
      - key: PDF_EXPORT_STORAGE_PROVIDER
        value: database
      - key: PDF_EXPORT_QUEUE_KEY
        value: queue:pdf_export
      - key: WORKER_HEARTBEAT_TTL_SECONDS
        value: "60"
