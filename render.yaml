services:
  - type: web
    name: iprp-api
    runtime: node
    rootDir: backend
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm start
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: DATABASE_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "15000"
      - key: HTTP_KEEP_ALIVE_TIMEOUT_MS
        value: "5000"
      - key: HTTP_HEADERS_TIMEOUT_MS
        value: "10000"
      - key: HTTP_REQUEST_TIMEOUT_MS
        value: "30000"
      - key: HTTP_MAX_HEADERS_COUNT
        value: "100"
      - key: REDIS_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWT_VERIFICATION_MODE
        value: jwks
      - key: SUPABASE_JWT_ALGORITHMS
        value: ES256
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: AUTH_RATE_LIMIT_ENABLED
        value: "true"
      - key: AUTH_RATE_LIMIT_KEY_SECRET
        sync: false
      - key: SEARCH_ENABLED
        value: "false"
      - key: OFFICE_ACTION_SEARCH_ENABLED
        value: "false"
      - key: WATCH_ENABLED
        value: "false"
      - key: PDF_EXPORT_ENABLED
        value: "false"
      - key: PAYSTACK_ENABLED
        value: "false"
      - key: PAYSTACK_MODE
        value: live
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_STARTER_PLAN_CODE
        sync: false
      - key: PAYSTACK_STARTER_AMOUNT_SUBUNIT
        sync: false
      - key: PAYSTACK_STARTER_CURRENCY
        value: NGN
      - key: PAYSTACK_PROFESSIONAL_PLAN_CODE
        sync: false
      - key: PAYSTACK_PROFESSIONAL_AMOUNT_SUBUNIT
        sync: false
      - key: PAYSTACK_PROFESSIONAL_CURRENCY
        value: NGN

  - type: cron
    name: iprp-uspto-ingestion
    runtime: node
    rootDir: backend
    schedule: "15 07 * * *"
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm ingest:uspto
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "3"
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "10000"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "60000"
      - key: USPTO_BULK_LISTING_URL
        sync: false
      - key: USPTO_INGESTION_OVERLAP_DAYS
        value: "3"
