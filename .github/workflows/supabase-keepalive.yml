name: Supabase Keep Alive

on:
  schedule:
    # Supabase Free projects may pause after low activity. This readiness probe
    # performs a real PostgreSQL SELECT 1 through the production API.
    - cron: "17 6,14,22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  keep-alive:
    name: Keep Supabase database active
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Probe production dependency readiness
        env:
          READY_URL: https://iprp-api.onrender.com/readyz
        run: |
          set -euo pipefail
          response="$(curl             --fail             --silent             --show-error             --location             --retry 3             --retry-delay 5             --connect-timeout 10             --max-time 30             "$READY_URL")"

          if [[ "$response" != '{"status":"ready"}' ]]; then
            echo "Unexpected readiness response: $response"
            exit 1
          fi

          echo "Supabase-backed readiness probe succeeded."
