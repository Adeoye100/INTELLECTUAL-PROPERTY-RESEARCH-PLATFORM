name: Frontend quality

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-quality.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-quality.yml'

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_MODE: live
      VITE_API_BASE_URL: https://api.ci.iprp.test/api/v1
      VITE_SUPABASE_URL: https://ci-project.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_ci_build_only
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: TypeScript and production build
        run: pnpm build

      - name: Report failure
        if: failure()
        run: |
          echo '### Frontend quality gate failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Open the failed lint, test, or build step above for its complete diagnostic output.' >> "$GITHUB_STEP_SUMMARY"
