<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">IPRP backend schema entity relationship diagram</title><desc id="desc">Firms own users, portfolio marks, search snapshots, exports and audit logs. Portfolio marks have watches, risk scores, alerts and Office Action references. Users request searches and exports. Registry trademarks are source references.</desc><style>text{font:14px sans-serif;fill:#0A1428}.box{fill:#fff;stroke:#146575;stroke-width:2}.line{stroke:#8B939E;stroke-width:2;fill:none}.head{fill:#0A1428;stroke:#0A1428}.headtext{fill:#fff;font-weight:700}</style><path class="line" d="M160 110L410 110M160 110L160 300M160 110L160 500M160 110L900 110M410 110L410 300M410 300L650 300M650 300L900 300M410 300L410 500M410 500L650 500M650 500L900 500M900 110L900 500M160 500L160 680"/><g transform="translate(40 70)"><rect class="box" width="220" height="80"/><rect class="head" width="220" height="28"/><text class="headtext" x="10" y="20">FIRMS</text><text x="10" y="50">PK id · name · tier</text></g><g transform="translate(300 70)"><rect class="box" width="220" height="80"/><rect class="head" width="220" height="28"/><text class="headtext" x="10" y="20">USERS</text><text x="10" y="50">PK id · FK firm_id · role</text></g><g transform="translate(40 260)"><rect class="box" width="220" height="80"/><rect class="head" width="220" height="28"/><text class="headtext" x="10" y="20">PORTFOLIO_MARKS</text><text x="10" y="50">PK id · FK firm_id · renewal</text></g><g transform="translate(300 260)"><rect class="box" width="220" height="80"/><rect class="head" width="220" height="28"/><text class="headtext" x="10" y="20">WATCHES</text><text x="10" y="50">PK id · FK mark · state</text></g><g transform="translate(560 260)"><rect class="box" width="220" height="80"/><rect class="head" width="220" height="28"/><text class="headtext" x="10" y="20">RISK_SCORES</text><text x="10" y="50">PK id · FK firm/mark/watch</text></g><g transform="translate(820 260)"><rect class="box" width="220" height="80"/><rect class="head" width="220" height="28"/><text class="headtext" x="10" y="20">ALERTS</text><text x="10" y="50">PK id · FK firm/watch/score</text></g><g transform="translate(40 460)"><rect class="box" width="220" height="80"/><rect class="head" width="220" height="28"/><text class="headtext" x="10" y="20">SEARCH_RESULTS</text><text x="10" y="50">PK id · FK firm/requester</text></g><g transform="translate(300 460)"><rect class="box" width="220" height="80"/><rect class="head" width="220" height="28"/><text class="headtext" x="10" y="20">EXPORTS</text><text x="10" y="50">PK id · FK firm/requester</text></g><g transform="translate(560 460)"><rect class="box" width="220" height="80"/><rect class="head" width="220" height="28"/><text class="headtext" x="10" y="20">OFFICE_ACTION_REFS</text><text x="10" y="50">PK id · FK firm/mark</text></g><g transform="translate(820 460)"><rect class="box" width="220" height="80"/><rect class="head" width="220" height="28"/><text class="headtext" x="10" y="20">AUDIT_LOGS</text><text x="10" y="50">PK id · FK firm/actor · append-only</text></g><g transform="translate(40 640)"><rect class="box" width="220" height="70"/><rect class="head" width="220" height="28"/><text class="headtext" x="10" y="20">REGISTRY_TRADEMARKS</text><text x="10" y="50">PK id · source registry/ref</text></g></svg>
